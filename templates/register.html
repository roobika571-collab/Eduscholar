{% extends "base.html" %}

{% block title %}Create Student Account – EduScholar{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                </svg>
            </div>
            <h1 class="auth-title">Student Registration</h1>
            <p class="auth-subtitle">Join thousands of students applying for vetted academic scholarships.</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" id="registerForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="full_name">Full Legal Name <span class="req">*</span></label>
                <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Eleanor Vance" required autofocus>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address <span class="req">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="student@university.edu" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="+1 (555) 000-0000">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="institution">Current Institution / School</label>
                    <input type="text" id="institution" name="institution" class="form-control" placeholder="e.g. State University">
                </div>
                <div class="form-group">
                    <label class="form-label" for="major">Field of Study / Major</label>
                    <input type="text" id="major" name="major" class="form-control" placeholder="e.g. Computer Science">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="education_level">Education Level</label>
                    <select id="education_level" name="education_level" class="form-control">
                        <option value="Undergraduate">Undergraduate</option>
                        <option value="High School">High School Senior</option>
                        <option value="Postgraduate">Graduate / Master's</option>
                        <option value="Doctorate">Doctorate / PhD</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="gpa">Current GPA (0.00 - 4.00)</label>
                    <input type="number" step="0.01" min="0.0" max="4.0" id="gpa" name="gpa" class="form-control" placeholder="e.g. 3.85">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="password">Password <span class="req">*</span></label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Min. 6 characters" minlength="6" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm Password <span class="req">*</span></label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" minlength="6" required>
                </div>
            </div>

            <div class="form-group" style="margin-top: 1rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account &amp; Continue</button>
            </div>
        </form>

        <div class="auth-footer">
            Already registered? <a href="{{ url_for('login') }}"><strong>Sign in to your account</strong></a>
        </div>
    </div>
</div>
{% endblock %}
